# ─────────────────────────────────────────────────────────────────────────────
# AddressGuard — Telegraph miner configuration
#
# Intent: FRAUD_DETECTION (verified canonical, 2026-09-02)
#
# ── The two fields that decide whether this miner ever receives traffic ──
#
# `endpoints[].intents` and `endpoints[].params` are present deliberately and
# must not be removed. Per telegraph-docs/miners/yaml-config.md:
#
#   intents   REQUIRED. "Routing selects an endpoint by intent. An endpoint
#             declaring no intents can never be selected — it exists in your
#             YAML and receives nothing." Registration is refused if NO
#             endpoint declares them.
#
#   params    "decides whether the request is well-formed. Without it the
#             builder has to guess your field names. Guessing is the single
#             most common cause of a miner rejecting the calls Telegraph
#             sends it."
#
# For this miner `params.body` is what tells Telegraph's request builder that
# `callerHistory` and `callerAddress` exist at all. Without it a routed call
# arrives carrying `address` only, no trusted set can be assembled, and every
# answer degrades to `insufficient_history` — registered, active, and useless.
# Seven of the fifteen live FRAUD_DETECTION miners omit both fields.
#
# ── Schema constraints observed (additionalProperties: false throughout) ──
#
#   input_schema / output_schema   top-level ONLY, never nested under endpoints
#   endpoints[]                    only: path, external_path, method,
#                                  description, intents, params,
#                                  endpoint_base_url, content_type,
#                                  multipart_fields, param_map
#   signal_mapping                 only: confidence_field, label_field,
#                                  reason_field  (no `type` key)
#
# Validate at https://integrate.telegraphprotocol.com before spending gas.
# ─────────────────────────────────────────────────────────────────────────────

version: "1"
kind: miner
id: 1155
slug: addressguard-poisoning-check
protocol: generic
name: AddressGuard Address Poisoning Detector

description: >
  Detects address-poisoning and lookalike-impersonation attacks by checking
  whether a destination address is a near-match of one the caller already
  trusts. Unlike scam-list or contract-risk miners, AddressGuard takes the
  caller's own trusted identities as input — supplied directly, or derived
  from the caller's signed transaction history on chain — and answers a single
  question: is this destination a lookalike of something you already pay?
  Returns safe / caution / high_risk with a 0-1 confidence, a structured
  machine-readable reason naming every contributing signal and its score, and
  block-pinned evidence including a deterministic canonical string for
  reproducibility. Never returns safe when no trusted identity was available
  to compare against; that case is reported as caution with reason
  insufficient_history.

base_url: https://addressguard.vercel.app

docs:
  repository: https://github.com/devIykee/addressguard

# ── Known constraints, declared so callers are warned before spending a call ──
limitations:
  - code: REQUIRES_TRUSTED_SET
    message: >
      A verdict requires at least one trusted identity to compare against —
      supply callerHistory, or callerAddress to derive it from chain. With
      neither, the answer is caution / insufficient_history rather than safe,
      because no comparison was performed.
  - code: SCOPE_LOOKALIKE_ONLY
    message: >
      Detects lookalike impersonation of the caller's own trusted identities
      only. A safe verdict means "not a lookalike of anything you trust" — it
      is not a general safety assertion, and does not cover contract risk,
      behavioural fraud, or scam-list membership.
  - code: CHAIN_DERIVATION_BEST_EFFORT
    message: >
      Chain-derived trust reads only transactions the caller signed, so
      contract-mediated sends (a DEX router moving tokens on the caller's
      behalf) are not included. Derivation is reliable on Ethereum and
      best-effort on Base. When it is unavailable the answer degrades to
      insufficient_history, never to a fabricated safe.
  - code: MAX_HISTORY_ENTRIES
    message: callerHistory and callerTrustedEnsNames accept at most 256 entries.
    param: callerHistory
    property: count
    value_num: 256
    operator: gt

auth:
  type: none

rate_limit_per_sec: 5
# No response cache: a verdict depends on the caller's trusted set, not just on
# the address, so caching by address would serve one caller's answer to another.
cache_ttl_sec: 0
circuit_threshold: 5
circuit_cooldown_seconds: 30

endpoints:
  - path: /risk-check
    external_path: /risk-check
    method: POST
    description: >
      Checks whether a destination address is a lookalike of an identity the
      caller already trusts — the address-poisoning attack, where an attacker
      vanity-mines an address matching the first and last characters of a real
      counterparty and plants it in the victim's transaction history to be
      copied out later. Pass the destination as `address` and the chain as
      `chain`. Supply the caller's trusted addresses as `callerHistory`, or
      pass the caller's own wallet as `callerAddress` to derive the trusted
      set from their signed transaction history on chain. Returns risk_label
      (safe / caution / high_risk), risk_confidence (0-1), and risk_reason
      naming each contributing signal and its score. Use this before sending
      funds to an address that was copied from a transaction history, an
      explorer, or a chat message.
    intents: [FRAUD_DETECTION]
    content_type: application/json
    params:
      body:
        required:
          - name: address
            type: string
            intents: ["*"]
            description: >
              The destination address being checked, 0x-prefixed and exactly 40
              hex characters. Accepted in any case; EIP-55 checksum casing is
              normalized rather than rejected. This is the address the caller is
              about to send funds to.
          - name: chain
            type: string
            intents: ["*"]
            description: >
              Which chain the address is on. Determines the RPC and explorer
              used for block-pinned evidence and for chain-derived trust.
            accepted_fields:
              - value: base
                intents: ["*"]
                description: Base mainnet (chain ID 8453).
              - value: ethereum
                intents: ["*"]
                description: Ethereum mainnet (chain ID 1).
        optional:
          - name: callerHistory
            type: array
            intents: ["*"]
            description: >
              Addresses the caller already trusts — previous recipients, saved
              contacts, known counterparties. Each a 0x-prefixed 40-hex-character
              address; at most 256. The destination is compared against every
              entry. An exact match is NOT poisoning and is excluded: it is an
              address the caller already legitimately uses. A malformed entry is
              scored zero and skipped rather than failing the request.
          - name: callerAddress
            type: string
            intents: ["*"]
            description: >
              The caller's own wallet address, 0x-prefixed and 40 hex
              characters. Used only when callerHistory is absent or empty, to
              derive the trusted set from the caller's own signed transactions
              on chain. Supply this when no explicit history is available — it
              is what lets an autonomously routed call produce a real verdict
              instead of insufficient_history.
          - name: ensName
            type: string
            intents: ["*"]
            description: >
              Optional ENS name for the destination, e.g. vitalik.eth. Accepted
              now and reserved for ENS typosquat detection; currently recorded
              but not scored.
          - name: callerTrustedEnsNames
            type: array
            intents: ["*"]
            description: >
              Optional ENS names the caller trusts, for comparison against
              ensName. Accepted now and reserved for ENS typosquat detection;
              currently recorded but not scored.

# ── Request/response shapes — TOP LEVEL ONLY (nesting these is rejected) ──
input_schema:
  type: object
  required: [address, chain]
  properties:
    address:
      type: string
      pattern: "^0x[0-9a-fA-F]{40}$"
      description: Destination address being checked.
    chain:
      type: string
      enum: [base, ethereum]
      description: Chain the address is on.
    callerHistory:
      type: array
      maxItems: 256
      items:
        type: string
      description: Addresses the caller already trusts.
    callerAddress:
      type: string
      pattern: "^0x[0-9a-fA-F]{40}$"
      description: >
        Caller's own wallet, used to derive the trusted set from chain when
        callerHistory is absent.
    ensName:
      type: string
      description: Optional ENS name for the destination. Reserved.
    callerTrustedEnsNames:
      type: array
      maxItems: 256
      items:
        type: string
      description: Optional ENS names the caller trusts. Reserved.

output_schema:
  type: object
  required: [address, risk_label, risk_confidence, risk_reason, evidence]
  properties:
    address:
      type: string
      description: The normalized (lowercased) address that was checked.
    risk_label:
      type: string
      enum: [safe, caution, high_risk]
      description: >
        high_risk — a strong lookalike match against a trusted identity.
        caution — a borderline match, or no trusted identity was available.
        safe — a real comparison ran against a non-empty trusted set and found
        no lookalike. Never returned when no comparison was performed.
    risk_confidence:
      type: number
      minimum: 0
      maximum: 1
      description: >
        The combined similarity score for a match; a fixed low value for
        insufficient_history; high for a clean check against real history.
    risk_reason:
      type: string
      description: >
        Structured and deterministic, never prose. One of
        "poisoning_match:<abbreviated>:similarity=<score>:<signal>=<score>...",
        "insufficient_history", or "no_poisoning_match". Every contributing
        signal is named with its own score, so a verdict is traceable to the
        evidence that produced it.
    detail:
      type: object
      description: Which trusted identity matched, how, and how strongly.
      properties:
        matched_against:
          type: [string, "null"]
          description: >
            The matched trusted identity, abbreviated the way a wallet UI
            truncates it — the same display convention the attack exploits.
        match_type:
          type: [string, "null"]
          description: prefix_suffix, full_levenshtein, or ens_homoglyph.
        similarity_score:
          type: number
          description: Combined similarity in 0-1, or 0 when there was no match.
        trusted_set_size:
          type: integer
          description: >
            How many trusted identities were actually compared against, after
            excluding any exact match with the destination.
        trust_source:
          type: string
          enum: [caller_supplied, chain_derived, mixed, none]
          description: Where the trusted set came from. `none` implies caution.
    evidence:
      type: object
      description: Verifiability metadata, present on every response.
      properties:
        checked_at_block:
          type: [integer, "null"]
          description: >
            Block height the answer was computed at, or null when no block could
            be read. Null rather than a stale or zero value: a wrong block
            number in a reproducibility field is worse than an absent one.
        checked_at:
          type: string
          description: ISO-8601 UTC timestamp of the check.
        canonical:
          type: string
          description: >
            Deterministic string over the exact inputs and outputs —
            "address|chain|risk_label|checked_at_block" — so identical inputs
            hash identically and an answer can be reproduced rather than merely
            asserted. The timestamp is deliberately excluded, since including it
            would make every hash unique.

# ── Errors: this API uses real HTTP status codes, so no status_path ──
errors:
  message_path: error
  code_path: error

semantics:
  signal_mapping:
    confidence_field: risk_confidence
    label_field: risk_label
    reason_field: risk_reason
  supported_intents:
    - FRAUD_DETECTION

# ── On-chain transform, for ERC-8183 jobs and on-chain miner requests ──
# Without this block the miner serves HTTP and WebSocket callers but cannot be
# targeted by an on-chain request at all — the node has no way to build the call.
on_chain:
  description: >
    Address-poisoning verdict as on-chain data: the risk label, the structured
    reason, the matched trusted identity, the confidence scaled to an integer,
    and the block the check was pinned to.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: risk_label
        description: safe, caution, or high_risk.
        source_path: risk_label
      - index: 1
        name: risk_reason
        description: Structured reason naming each contributing signal.
        source_path: risk_reason
      - index: 2
        name: canonical
        description: Deterministic canonical string for reproducibility.
        source_path: evidence.canonical
    integers:
      - index: 0
        name: risk_confidence_x10000
        description: Confidence in 0-1, multiplied by 10000.
        source_path: risk_confidence
        multiplier: 10000
      - index: 1
        name: checked_at_block
        description: Block height the check was pinned to.
        source_path: evidence.checked_at_block
  request:
    - endpoint: risk-check
      method: POST
      content_type: application/json
      body:
        address: { source: strings.0 }
        chain: { source: strings.1 }
        callerAddress: { source: strings.2, optional: true }
